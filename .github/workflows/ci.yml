name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Install Playwright browser and system dependencies
        run: npm exec --workspace @sniffo/web -- playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e -w @sniffo/web
